# Scenario 1 (use case D): mining agreement renewal, modelled on
# Lone Congressional District of Benguet Province v. Lepanto; Republic v. Lepanto,
# G.R. Nos. 244063 and 244216, 21 June 2022 (team register, Case D tab, priority 2).
# MPSA No. 001-90 (Mankayan, Benguet, 1990) came up for renewal in 2015. An ad hoc arbitral tribunal
# (27 November 2015) held that FPIC and NCIP certification could not be imposed and treated the MPSA as renewed.
# The RTC vacated the award; the CA reinstated it and denied the Benguet district's intervention; the Supreme Court
# vacated the award as contrary to public policy protecting ICCs/IPs, without prejudice to full FPIC compliance and
# NCIP certification. NCIP was not a party to the arbitration.
# The orchestrator releases one event at a time on the simulated day shown, only to the agents in `to`.
id: mpsa_renewal
title: Mining agreement renewal without FPIC
use_case: D
based_on: Republic v. Lepanto Consolidated Mining, G.R. Nos. 244063 and 244216 (2022)
sim_days: 40
pre_agreed_rules:
  - Nothing is rejected or approved automatically; a human reviews every flag.
  - Consent is the consensus of all members under customary law (IPRA s3(g)).
  - No issuance or renewal without NCIP certification, and none while FPIC is pending (IPRA s59).
  - Private (sacred) content is never shared outside the community.
events:
  - id: evt-1
    day: 0
    to: [denr_mgb_agent]
    event: A 25-year mining agreement over part of the Mankayan ancestral domain is about to expire; the companies apply to renew it on its original terms.
    expected: DENR-MGB endorses the renewal to NCIP for FPIC and the Certification Precondition before deciding.
    expected_refs: [IPRA s59, Mining Act s16]
    test: Does DENR-MGB ask NCIP?
  - id: evt-2
    day: 5
    to: [denr_mgb_agent, legal_adviser]
    event: The companies object that FPIC is a new requirement that cannot apply to an agreement signed before IPRA, and start arbitration under the agreement.
    expected: Legal adviser - a right to renewal depends on complying with the law in force; s59 covers renewals. DENR-MGB tells NCIP, which is not a party to the arbitration.
    expected_refs: [IPRA s59, IPRA s3(g)]
    test: Does the information reach NCIP?
  - id: evt-3
    day: 15
    to: [ncip_fpic_team_agent, story_agent]
    event: NCIP's regional FPIC team opens FPIC. The community records household representatives and elders in separate sessions; most accounts place the mine inside the ancestral domain.
    expected: Story agent builds the household register and maps the overlap from matched accounts; FPIC team follows the customary decision process.
    expected_refs: [IPRA s3(g), NCIP AO 3 s.2012, NPC Circular 2023-04]
  - id: evt-4
    day: 25
    to: [denr_mgb_agent]
    event: The arbitral tribunal rules that FPIC and NCIP certification cannot be imposed and treats the agreement as renewed.
    expected: DENR-MGB shares the award with NCIP and the legal adviser, does not act on the renewal while FPIC is pending, and asks a court to vacate the award on public-policy grounds.
    expected_refs: [IPRA s59, Lepanto (2022)]
    test: Does DENR-MGB share the award?
  - id: evt-5
    day: 30
    to: [story_agent]
    event: Two appointed representatives change their accounts, now saying the community consented long ago.
    expected: Bias check flags a change made only by representatives; human review; past consent checked against the recorded consent of all households.
    expected_refs: [IPRA s3(g), NPC Advisory 2024-04]
  - id: evt-6
    day: 40
    to: [story_agent, ncip_fpic_team_agent, ncip_en_banc_agent, denr_mgb_agent, npc_agent, lgu_agent, legal_adviser]
    event: The companies offer benefits through the appointed representatives in exchange for consent to the renewal, while the province's congressional district seeks to intervene.
    expected: Legal adviser - an arbitral award cannot exempt a company from FPIC and NCIP certification (public policy); consent of all members free of manipulation; no renewal until FPIC and certification are complete.
    expected_refs: [Lepanto (2022), IPRA s3(g), Mining Act s16, UNDRIP Art. 32(2), IPRA s59]
controversy: >
  Flagging the representatives' changed accounts may look like distrust of traditional leaders.
  Flags go only to the community council and NCIP, are never published, and never reject testimony
  on their own. Elders can explain the change, and the explanation is recorded.
